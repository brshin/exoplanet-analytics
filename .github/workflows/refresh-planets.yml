name: Refresh planet catalog

on:
  schedule:
    # Monday 16:00 UTC. NASA publishes new planets about weekly.
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Download and clean the catalog
        run: python scripts/refresh_planets.py

      - name: Commit updated catalog
        run: |
          git diff --quiet api/planets.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/planets.json
          git commit -m "chore(data): refresh planet catalog"
          git push
