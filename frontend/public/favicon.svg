<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Exoplanet Analytics">
  <defs>
    <linearGradient id="core" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88d8ff"/>
      <stop offset="100%" stop-color="#8c69ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0c1016"/>
  <g transform="translate(16 16) rotate(-22)">
    <circle r="10.4" fill="none" stroke="#9880ff" stroke-opacity="0.55" stroke-width="1.25"/>
    <ellipse rx="12.6" ry="3.85" fill="none" stroke="#60b2e1" stroke-opacity="0.8" stroke-width="1.25"/>
    <circle r="2.9" fill="url(#core)" filter="url(#glow)"/>
  </g>
</svg>
